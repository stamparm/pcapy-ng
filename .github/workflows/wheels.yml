name: Build wheels

# Produce self-contained, precompiled wheels (libpcap vendored in) plus an sdist, so
# downstream users (e.g. Maltrail sensors) can `pip install pcapy-ng` with no C toolchain
# or libpcap-dev at deploy time.
#
# Triggers:
#   * push of a version tag ("2.0.1" or "v2.0.1") -> build + test wheels and sdist (artifacts only)
#   * manual run                                  -> same; set "publish" to upload to PyPI
#   * publishing a GitHub Release                 -> build + test + upload to PyPI
#
# Uploading requires PyPI Trusted Publishing to be configured for this repository plus a
# GitHub environment named "pypi"; until then the publish job simply never runs.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the built artifacts to PyPI"
        type: boolean
        default: false

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest        # linux x86_64 (manylinux + musllinux)
          - ubuntu-24.04-arm     # linux aarch64
          - macos-13             # macOS x86_64
          - macos-latest         # macOS arm64
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        # all configuration lives in [tool.cibuildwheel] in pyproject.toml

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install build deps
        run: |
          sudo apt-get update && sudo apt-get install -y libpcap-dev
          python -m pip install --upgrade build twine
      - name: Build sdist
        run: python -m build --sdist
      - name: Check metadata
        run: python -m twine check dist/*.tar.gz
      - name: Install from sdist and run the test suite
        run: |
          python -m pip install dist/*.tar.gz
          python tests/wheel_smoketest.py tests/96pings.pcap
          python -m unittest discover -s tests -p test_fast.py
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
