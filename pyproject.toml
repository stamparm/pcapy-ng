[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

# Project metadata is kept in setup.py (it also defines the C Extension); this file adds the
# modern build-system declaration and the cibuildwheel configuration for producing
# self-contained, precompiled wheels (no deploy-time C compiler or libpcap-dev required).

[tool.cibuildwheel]
# CPython only (the extension uses the CPython C-API); covers the maintained 3.x series, which
# is also exactly what python_requires in setup.py allows and what CI tests.
# Free-threaded builds (cp3XXt-*) are deliberately not selected: the module does not declare
# Py_mod_gil support yet.
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
# 32-bit and non-CPython interpreters are not targeted.
skip = "*_i686 *-musllinux_i686 pp* gp*"
build-verbosity = 1
# Test every built wheel in an isolated env: import it, run the classic loop(), confirm the
# fast-path API is present, then run the full fast-path unit test battery against the wheel.
test-command = [
    "python {project}/tests/wheel_smoketest.py {project}/tests/96pings.pcap",
    "python -m unittest discover -s {project}/tests -p test_fast.py -v",
]

[tool.cibuildwheel.linux]
# libpcap headers are needed to COMPILE; auditwheel then vendors libpcap.so INTO the wheel
# so the installed wheel is self-contained at runtime. Cover both manylinux (yum/dnf) and
# musllinux (apk) base images.
before-all = [
    "yum install -y libpcap-devel || dnf install -y libpcap-devel || true",
    "apk add --no-cache libpcap-dev || true",
]

[tool.cibuildwheel.macos]
# macOS ships libpcap in the SDK; the brew package is only a fallback for older images.
before-all = "brew install libpcap || true"
